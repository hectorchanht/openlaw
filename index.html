<style>
:root{--bg:#0a0a0b;--panel:#131315;--panel2:#17171a;--line:#26262b;--text:#f5f2ee;--muted:#a8a29b;--accent:#d9a441;--accent-soft:#eec27a;--radius:16px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans CJK TC",sans-serif;--serif:Georgia,"Times New Roman","Noto Serif TC","Noto Serif CJK TC",serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 20px;min-width:0}
a{color:var(--accent-soft)}
header.utility{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700;letter-spacing:.02em;min-width:0}
.brand img{width:40px;height:40px;flex:0 0 auto}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .hall{color:var(--muted);font-weight:500;font-size:.85rem}
.lang-switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel);flex:0 0 auto}
.lang-switch button{min-width:44px;min-height:34px;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font:600 .88rem var(--sans)}
.lang-switch button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.hero{padding:38px 0 8px}
.hero .mark{width:84px;height:84px}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.05;margin:.35em 0 .25em;font-weight:800;letter-spacing:-.01em;overflow-wrap:break-word}
.hero .promise{font-family:var(--serif);font-size:clamp(1.12rem,4.6vw,1.45rem);line-height:1.5;color:#e8e2d9;max-width:34em}
.status{display:inline-flex;max-width:100%;margin-top:16px;padding:7px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent-soft);font-size:.9rem;font-weight:600}
.status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
section.block{padding:22px 0 4px}
section.block>h2{font-size:clamp(1.4rem,6vw,1.9rem);margin:10px 0 10px}
section.block>p{color:#e8e2d9;max-width:36em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 14px;min-width:0}
.card h3{font-size:1.12rem;margin:0 0 .4em;line-height:1.3;overflow-wrap:break-word}
.card p{margin:0;color:var(--muted)}
ol.road{margin:0;padding-left:1.3em;color:#e8e2d9}
ol.road li{margin:0 0 10px}
.kicker{color:var(--accent-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:26px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem;margin-top:26px}
footer p{margin:0}footer .links{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.footer-legal{color:var(--muted);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
@media (max-width:520px){header.utility{min-height:56px}footer{align-items:flex-start;flex-direction:column}}
</style>

<body id="top">
<div class="wrap">
<header class="utility">

<script>
const I={"en": {"promise": "The law everyone needs, in the plainest language.", "desc": "OpenLaw opens the law that touches ordinary life: plain language, ages 3 to 90, free to read, organised by the moment you need it — not by statute book. Education, not legal advice.", "whatH": "What it is", "goalH": "END GOAL", "goal": "Open the closed world of law: the law that touches ordinary life, in the plainest language, for ages 3 to 90, free to read, organised by the moment you need it — not by statute book. Free to read, in the Dawn pattern; the scale Hector sees is trust, not a paywall on rights.", "roadH": "ROADMAP", "statusH": "STATUS", "status": "Founding — direction set, grilling not yet done. No content cards are published yet; the seed content pack is the next step.", "guardH": "Guardrails", "guard": "Education, NOT legal advice — every card will say so plainly, and high-stakes situations route to “find a lawyer” guidance: what to ask, and what it should cost. Accuracy is life-critical: provisions are verified against official sources, and laws change, so review cadence is part of the product.", "foot": "Dawn Studio · Independent software.", "hall": "OpenSchool family", "what": [["Discovery by life event, not by code", "You arrive with a situation — a deposit withheld on a rental, being let go at work, marriage or divorce, a sales dispute, being questioned by police, making a will, a family member passing — not with a citation."], ["One text, three readings", "One-line version (your position in a single line), plain version (what the law says, your options, what people usually get wrong), advanced version (the actual provisions, case anchors, where to verify)."], ["Jurisdiction is a truth label", "Law differs by place. Every card carries its jurisdiction — Hong Kong / Alberta, Canada / general principles — as visibly as a source level. A card without a place is a defect."], ["Always linked", "Law ↔ life stage ↔ OpenHealth (medical decisions, ageing, wills and medical directives are two sides of one thing) ↔ official sources — government pages and the actual ordinance text, always one tap away."]], "road": ["Seed content pack — everyday situations, Hong Kong + Alberta first", "Space — the founding home for the work", "Grilling — jurisdiction order, depth, and review cadence"]}, "zh": {"promise": "每個人都要用嘅法律，用最直白嘅語言講明。", "desc": "OpenLaw 打開每個人日常都要用嘅法律：最直白嘅語言，3 到 90 歲都睇得明，免費閱讀，按你需要嗰一刻去組織 — 唔係按法典書排。係教育，唔係法律意見。", "whatH": "呢個係咩", "goalH": "終極目標 · END GOAL", "goal": "打開封閉嘅法律世界：每個人日常都要用嘅法律，用最直白嘅語言，3 到 90 歲，免費閱讀，按你需要嗰一刻去組織 — 唔係按法典書排。跟 Dawn 模式免費閱讀；規模來自信任，唔係喺權利上面起收費牆。", "roadH": "路線圖 · ROADMAP", "statusH": "現況 · STATUS", "status": "創建中 — 方向已定，grilling 未完成。暫時未有內容卡出版；下一步係種子內容包。", "guardH": "守則", "guard": "係教育，唔係法律意見 — 每張卡都會講明；高風險處境會引導你「搵律師」：問咩、合理收費係幾多。準確性關乎人生：條文會對照官方來源核實，法律會變，覆核節奏係產品嘅一部分。", "foot": "Dawn Studio · 獨立軟件。", "hall": "OpenSchool 家族", "what": [["按人生事件搵，唔係按法典", "你帶住一個處境嚟 — 租樓被扣按金、返工被炒、結婚／離婚、買賣糾紛、被警察問話、立遺囑、家人離世點處理 — 唔係帶住一條條文編號。"], ["一文三讀", "一句話版（你嘅處境，一行講明）、大眾版（法律點講、你有咩選擇、人哋通常錯喺邊）、進階版（真正條文、案例錨點、去邊度核實）。"], ["司法管轄區係真理標籤", "法律因地方而異。每張卡都清楚標明司法管轄區 — 香港／加拿大 Alberta／通用原則 — 好似來源等級咁顯眼。冇地方標籤嘅卡，係缺陷。"], ["永遠互連", "法律 ↔ 人生階段 ↔ OpenHealth（醫療決定、安老、遺囑與醫療指示係一件事嘅兩面）↔ 官方來源 — 政府頁面同真正嘅條例原文，永遠一按即達。"]], "road": ["種子內容包 — 日常處境，香港 + Alberta 先行", "Space — 呢個項目嘅立派基地", "Grilling — 司法管轄區次序、深度、覆核節奏"]}};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setLang(l){
  document.documentElement.lang = l==="zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(typeof I[l][k]==="string") el.textContent=I[l][k]; });
  document.getElementById("what").innerHTML = I[l].what.map(x=>'<div class="card"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join("");
  document.getElementById("road").innerHTML = I[l].road.map(x=>'<li>'+esc(x)+'</li>').join("");
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  document.getElementById("btn-zh").setAttribute("aria-pressed", l==="zh");
  try{localStorage.setItem("openlaw-lang", l)}catch(e){}
}
document.getElementById("btn-en").addEventListener("click",()=>setLang("en"));
document.getElementById("btn-zh").addEventListener("click",()=>setLang("zh"));
let init="en"; try{ init = localStorage.getItem("openlaw-lang")||"en" }catch(e){}
setLang(init==="zh"?"zh":"en");
</script>
